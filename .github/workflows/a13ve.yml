name: Galaxy A13 (SM-A137F) Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "copilot/**" ]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # CACHING: Saves time by not re-downloading Clang every run
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES: Standard build tools required by kernel.mk
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl ca-certificates \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # KERNELSU-NEXT: Using Legacy Setup Script
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "KernelSU-Next Setup (Legacy)"
          echo "=========================================="

          # KernelSU-Next's own setup script clones the repository and checks
          # out the requested branch/commit. Run it once only.
          bash <(curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/legacy/kernel/setup.sh") \
            legacy

          echo "===== KernelSU commit ====="
          git -C KernelSU-Next rev-parse HEAD
          git -C KernelSU-Next log -1 --oneline

          echo "===== KernelSU event.c before patch ====="
          grep -n \
            -E "ksu_sulog_boottime|ktime_get_boottime_ts64|get_monotonic_boottime|struct timespec" \
            KernelSU-Next/kernel/sulog/event.c || true

          python3 - <<'PYEOF'
          from pathlib import Path
          import sys

          EVENT = Path("KernelSU-Next/kernel/sulog/event.c")
          SELINUX_HIDE = Path("KernelSU-Next/kernel/feature/selinux_hide.c")


          def fail(label, message):
              print(f"::error::[{label}] {message}")
              sys.exit(1)


          # -------------------------------------------------------------------
          # event.c
          # -------------------------------------------------------------------

          content = EVENT.read_text()

          old_helper = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 19, 0)
          static inline void ksu_sulog_boottime(struct timespec64 *ts)
          {
          	ktime_get_boottime_ts64(ts);
          }
          #else
          static inline void ksu_sulog_boottime(struct timespec *ts)
          {
          	get_monotonic_boottime(ts);
          }
          #endif"""

          new_helper = """static inline void ksu_sulog_boottime(struct timespec64 *ts)
          {
          	ktime_get_boottime_ts64(ts);
          }"""

          if old_helper in content:
              content = content.replace(old_helper, new_helper)
              print("[event.c boottime helper] applied")
          elif new_helper in content:
              print("[event.c boottime helper] already patched")
          else:
              fail(
                  "event.c boottime helper",
                  "Current event.c does not match the expected KernelSU-Next "
                  "legacy compatibility helper."
              )

          old_decl = """#if KERNEL_VERSION(4, 19, 0) <= LINUX_VERSION_CODE
          	struct timespec64 ts;
          #else
          	struct timespec ts;
          #endif"""

          new_decl = """struct timespec64 ts;"""

          occurrences = content.count(old_decl)

          if occurrences:
              content = content.replace(old_decl, new_decl)
              print(
                  f"[event.c timespec declarations] converted "
                  f"{occurrences} occurrence(s)"
              )
          elif content.count(new_decl) >= 2:
              print("[event.c timespec declarations] already patched")
          else:
              fail(
                  "event.c timespec declarations",
                  "Expected timespec compatibility declarations were not found."
              )

          EVENT.write_text(content)

          # -------------------------------------------------------------------
          # selinux_hide.c
          # -------------------------------------------------------------------
          content = SELINUX_HIDE.read_text()

          old_selinux = "filp->private_data = page_address(data);"
          new_selinux = "filp->private_data = data;"

          if old_selinux in content:
              content = content.replace(old_selinux, new_selinux)
              SELINUX_HIDE.write_text(content)
              print("[selinux_hide page pointer] applied")
          elif new_selinux in content:
              print("[selinux_hide page pointer] already patched")
          else:
              fail(
                  "selinux_hide page pointer",
                  "Neither the original nor patched private_data assignment "
                  "was found."
              )

          PYEOF
          
          echo "=========================================="
          echo "Patching KernelSU-Next Kprobes compatibility"
          echo "=========================================="

          python3 - <<'PYEOF'
          from pathlib import Path
          import sys

          p = Path("KernelSU-Next/kernel/runtime/ksud_integration.c")
          content = p.read_text()

          old = """#ifdef KSU_KPROBES_HOOK
          static struct work_struct __maybe_unused stop_init_rc_hook_work;
          static struct work_struct __maybe_unused stop_execve_hook_work;
          static struct work_struct __maybe_unused stop_input_hook_work;
          static DECLARE_COMPLETION(stop_input_hook_work_complete);
          #else
          bool ksu_init_rc_hook __read_mostly = true;
          #endif"""

          new = """#ifdef KSU_KPROBES_HOOK
          static struct work_struct __maybe_unused stop_init_rc_hook_work;
          static struct work_struct __maybe_unused stop_execve_hook_work;
          static struct work_struct __maybe_unused stop_input_hook_work;
          static DECLARE_COMPLETION(stop_input_hook_work_complete);
          #endif

          bool ksu_init_rc_hook __read_mostly = true;"""

          if old in content:
              content = content.replace(old, new, 1)
              p.write_text(content)
              print("[ksud_integration.c ksu_init_rc_hook] applied")
          elif new in content:
              print("[ksud_integration.c ksu_init_rc_hook] already patched")
          else:
              print("::error::ksu_init_rc_hook compatibility block not found")
              sys.exit(1)
          PYEOF

          echo "===== KernelSU integration verification ====="
          sed -n '155,185p' KernelSU-Next/kernel/runtime/ksud_integration.c

          echo "===== KernelSU symlink verification ====="
          ls -la drivers/kernelsu
          readlink -f drivers/kernelsu

          echo "===== ksu_init_rc_hook ====="
          grep -n "ksu_init_rc_hook" drivers/kernelsu/runtime/ksud_integration.c || true

          echo "===== KernelSU version repository ====="
          git -C KernelSU-Next rev-parse --is-inside-work-tree
          git -C KernelSU-Next rev-parse HEAD

          echo "=========================================="
          echo "✓ KernelSU-Next setup complete"
          echo "=========================================="
          
      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/AlfCraft07/AnyKernel3.git ~/AnyKernel3
          cd ~/AnyKernel3
          cat > anykernel.sh << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Script for GTA4XLVE
          
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=slmkernel a13ve (SM-A137F)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=gta4xlve
          device.name2=gta4xl
          device.name3=SM-P613
          device.name4=gta4xlveu
          device.name5=SM-P619
          supported.versions=11-16
          supported.patchlevels=
          '; } # end properties
          
          ## AnyKernel boot install
          # begin attributes
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          # boot header version 2 for this device
          boot_img_hdr_ver=2
          # end attributes
          
          ## AnyKernel methods (DO NOT CHANGE)
          # import patching functions/variables - see for reference
          . tools/ak3-core.sh;
          
          ## AnyKernel boot install
          split_boot; # use split_boot to extract ramdisk and kernel
          
          # Install kernel image
          flash_boot;
          ## end boot install
          EOF
          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD LOGIC: Extracted directly from LineageOS kernel.mk
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        run: |
          # 1. Setup Environment Variables (mimicking BoardConfig.mk)
          export PATH=~/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          
          # Flags found in kernel.mk
          export LLVM=1
          export LLVM_IAS=1
          
          # 2. Clean
          rm -rf out && mkdir -p out

          # 3. Compile (KERNEL_MAKE_CMD)
          # For devices with CONFIG_BUILD_ARM64_DT_OVERLAY=y (overlay mode):
          # - Build Image.gz (not Image.gz-dtb) to avoid dtbs dependency
          # - Image.gz-dtb depends on 'dtbs' target which tries to build overlays
          # - Overlays are applied by bootloader at runtime, not appended to kernel
          # - This follows LineageOS methodology for overlay-enabled devices
          
          echo "--> Building kernel..."
          echo "--> Compiling Image.gz..."
          set -o pipefail
          make O=out a13ve_defconfig KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j$(nproc) Image.gz 2>&1 | tee build.log
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            echo "==================== COMPILER ERRORS ===================="
            grep -i -n -E "error:|fatal error:|undefined reference" build.log -B 2 -A 5 || true
            echo "=========================================================="
            echo "Last 100 lines of build log:"
            tail -100 build.log
            exit $BUILD_STATUS
          fi

      # -----------------------------------------------------------------------
      # PACKAGING: AnyKernel3
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        run: |
          cd ~/AnyKernel3
          rm -rf .git* README.md
          
          # Create custom README for the ZIP
          cat > README.md << 'EOF'
          # slmkernel a13ve
          
          ## What's Included
          - slmkernel for a13ve platform with 5.10 BPF backports
          - Image.gz - Kernel image for overlay-enabled device
          - AnyKernel3 flasher script
          
          ## How to Flash
          
          ### LineageOS Users (No TWRP needed!)
          1. Boot into LineageOS Recovery (Vol Up + Power)
          2. Navigate: Apply update → Apply from ADB
          3. On PC: `adb sideload slm-a13ve-YYYYMMDD.zip`
          4. Reboot and enjoy!
          
          ### TWRP/OrangeFox Users
          1. Boot into TWRP/OrangeFox recovery
          2. Flash this ZIP file
          3. Reboot and enjoy!
          
          ## Device Compatibility
          - Samsung Galaxy A13 (SM-A137F)
          - Models: a13ve
          - Android 11-16 / LineageOS 18-23
          
          ## Credits
          - @IamKavy47 for the script
          - @mertsan2007 for the kernel
          
          ---
          EOF
          
          # Copy Artifacts
          # For overlay-enabled devices, use Image.gz (overlays applied by bootloader)
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz ]; then
             cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz .
             echo "✓ Copied Image.gz"
          else
             echo "Build Failed: Image.gz not found"
             exit 1
          fi
          
          # Verify package contents
          echo "Package contents:"
          ls -lah
          
          # Create ZIP
          ZIPNAME="slmkernel3-a13ve-$(date +%Y%m%d).zip"
          zip -r9 $GITHUB_WORKSPACE/$ZIPNAME *
          echo "✓ Created $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIPNAME }}
          archive: false

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
