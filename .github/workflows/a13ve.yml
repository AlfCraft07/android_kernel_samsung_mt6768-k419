
name: Galaxy A13 (SM-A137F) Build

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "copilot/**"]

jobs:
  build:
    name: Build Kernel (LineageOS Logic)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # CACHING: Proton Clang
      # -----------------------------------------------------------------------
      - name: Cache Proton Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Setup Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/toolchains
          echo "Cloning Proton Clang..."
          git clone https://github.com/kdrag0n/proton-clang.git \
            --depth=1 ~/toolchains/clang

      # -----------------------------------------------------------------------
      # DEPENDENCIES
      # -----------------------------------------------------------------------
      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git kmod \
            libncurses5-dev libssl-dev rsync zip unzip wget curl \
            ca-certificates gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu device-tree-compiler

      # -----------------------------------------------------------------------
      # KERNELSU-NEXT
      # Use current setup script with legacy integration mode.
      # -----------------------------------------------------------------------
      - name: Setup KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "KernelSU-Next Setup (next / legacy)"
          echo "=========================================="

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo "=========================================="
          echo "KernelSU-Next setup script finished."
          echo "=========================================="

          echo "Checking for KSUN source/version information..."
          grep -R -n -m 10 \
            --exclude-dir=.git \
            --exclude='*.o' \
            --exclude='*.cmd' \
            -E 'KSU_VERSION|KSUN_VERSION|33315|VERSION_NAME' \
            drivers KernelSU kernel 2>/dev/null || true

      # -----------------------------------------------------------------------
      # ANYKERNEL3
      # -----------------------------------------------------------------------
      - name: Setup AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/AlfCraft07/AnyKernel3.git \
            ~/AnyKernel3

          cd ~/AnyKernel3

          cat > anykernel.sh << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Script for a13ve

          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=Legion Kernel for mt6768 platform - Built for a13ve (SM-A137F)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a13ve
          device.name2=SM-A137F
          supported.versions=11-17
          supported.patchlevels=
          '; } # end properties

          ## AnyKernel boot install
          # begin attributes
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # Boot header version 2 for this device
          boot_img_hdr_ver=2
          # end attributes

          ## AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh;

          ## AnyKernel boot install
          split_boot;
          flash_boot;
          ## end boot install
          EOF

          chmod +x anykernel.sh

      # -----------------------------------------------------------------------
      # BUILD KERNEL
      # -----------------------------------------------------------------------
      - name: Compile Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/toolchains/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE64=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS=-w
          export CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          export LLVM=1
          export LLVM_IAS=1

          echo "=========================================="
          echo "Kernel version:"
          make --version | head -1
          clang --version | head -1
          echo "=========================================="

          rm -rf out
          mkdir -p out

          echo "--> Configuring and building Image.gz..."

          if make O=out a13ve_defconfig \
            KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y; then
            echo "Defconfig generated successfully."
          else
            echo "ERROR: a13ve_defconfig failed."
            exit 1
          fi

          if make O=out \
            KCFLAGS=-w \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            -j"$(nproc)" Image.gz 2>&1 | tee build.log; then
            echo "Kernel compilation succeeded."
          else
            BUILD_STATUS=$?
            echo "Build failed with status $BUILD_STATUS"
            echo "==================== COMPILER ERRORS ===================="
            grep -i -n -E \
              "error:|fatal error:|undefined reference" \
              build.log -B 2 -A 5 || true
            echo "=========================================================="
            tail -100 build.log || true
            exit "$BUILD_STATUS"
          fi

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: Image.gz not found."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # PACKAGE FLASHABLE ZIP
      # -----------------------------------------------------------------------
      - name: Create Flashable ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd ~/AnyKernel3

          rm -rf .git .github README.md

          cat > README.md << 'EOF'
          # Legion Kernel for a13ve

          ## What's Included
          - Legion kernel for a13ve platform with 5.15 BPF backports
          - Image.gz kernel image
          - AnyKernel3 installer

          ## How to Flash

          ### Recovery
          1. Boot into a compatible recovery.
          2. Flash the ZIP.
          3. Reboot.

          ### ADB Sideload
          Use sideload only if your recovery supports installing this
          AnyKernel3 package through that method.

          ## Device Compatibility
          - Samsung Galaxy A13 (SM-A137F)
          - Device: a13ve

          ## Credits
          - @IamKavy47
          - @mertsan2007
          EOF

          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz" .

          echo "Package contents:"
          ls -lah

          ZIPNAME="legion-a13ve-$(date -u +%Y%m%d).zip"
          zip -r9 "$GITHUB_WORKSPACE/$ZIPNAME" \
            anykernel.sh tools Image.gz README.md

          echo "Created $ZIPNAME"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # UPLOAD ARTIFACTS
      # -----------------------------------------------------------------------
      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: legion-a13ve
          path: ${{ env.ZIPNAME }}
          if-no-files-found: error
          archive: false

      - name: Upload Build Log (Debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
